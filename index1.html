<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Good morning</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌅%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{--plum:#4a2a3f;--rose:#e0607e;--wood:#3b2a22;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:#2a1c18;overflow:hidden;overscroll-behavior:none}
.win{position:relative;height:100%;overflow:hidden;touch-action:none;background:linear-gradient(#a9d6ec 0%,#f6d9e2 45%,#ffc9a0 72%,#ffae7a 100%)}
.sun{position:absolute;left:50%;bottom:20%;width:clamp(120px,26vw,190px);aspect-ratio:1;margin-left:calc(clamp(120px,26vw,190px)/-2);border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#fffbe0,#ffd35c 55%,#ff9e4a);box-shadow:0 0 80px 30px rgba(255,190,110,.55);
  transition:transform 4s cubic-bezier(.2,.7,.2,1),box-shadow 4s;z-index:1}
.done .sun{transform:translateY(-12vh);box-shadow:0 0 170px 90px rgba(255,200,120,.7)}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:38%;z-index:2}
.birds{position:absolute;inset:0;opacity:0;transition:opacity 2s 1s;z-index:1;pointer-events:none}
.done .birds{opacity:.8}
.birds svg{position:absolute;left:-60px;width:30px;fill:none;stroke:var(--plum);stroke-width:2.2;stroke-linecap:round}
.b1{top:46%;animation:fly 16s linear infinite}
.b2{top:40%;width:24px!important;animation:fly 21s linear -7s infinite}
.b3{top:52%;width:20px!important;animation:fly 25s linear -14s infinite}
@keyframes fly{to{transform:translate(calc(100vw + 120px),-70px)}}
.msg{position:absolute;top:5%;bottom:44px;left:0;right:0;padding:.8rem 1.1rem;text-align:center;color:var(--plum);z-index:3;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
h1{font:400 clamp(1.8rem,7.5vw,3.2rem)/1.1 "Young Serif",Georgia,serif;margin:0 auto .9rem;max-width:12em;text-wrap:balance}
.msg p{font:500 clamp(1.2rem,4.6vw,1.6rem)/1.3 "Caveat",cursive;margin:.7rem auto;max-width:24em}
#lines{background:rgba(255,248,243,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:20px;padding:.5rem 1.1rem;max-width:30em;margin:0 auto}
.from{margin-top:1.3rem!important;font-weight:600!important;color:var(--rose);opacity:0;transform:translateY(8px);transition:opacity 1.4s 1.6s,transform 1.4s 1.6s}
.done .from{opacity:1;transform:none}
#fog{position:absolute;inset:0;width:100%;height:100%;z-index:5;transition:opacity 1.6s ease;touch-action:none;cursor:crosshair}
.frame{position:absolute;inset:0;z-index:6;pointer-events:none;border:12px solid var(--wood);border-bottom-width:34px;box-shadow:inset 0 0 50px rgba(0,0,0,.35)}
.hint{position:absolute;left:0;right:0;top:46%;text-align:center;z-index:7;pointer-events:none;font:600 clamp(1.5rem,6vw,2.2rem) "Caveat",cursive;color:#5b6b7a;transition:opacity .6s}
.hint i{display:block;font-style:normal;font-size:2.4rem;animation:nudge 1.8s ease-in-out infinite}
.gone{opacity:0}
@keyframes nudge{50%{transform:translateX(26px)}}
.heart{position:absolute;color:var(--rose);z-index:8;pointer-events:none;opacity:.9}
.heart.rise{bottom:-30px;animation:rise var(--d) ease-in forwards}
.heart.pop{animation:pop 1.2s ease-out forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(var(--r));opacity:0}}
@keyframes pop{to{transform:translateY(-90px) scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.hint i,.birds svg,.heart{animation:none}.done .sun{transition:none}.heart{display:none}}
</style>
</head>
<body>
<main class="win" id="win">
  <div class="sun" aria-hidden="true"></div>
  <div class="birds" aria-hidden="true">
    <svg class="b1" viewBox="0 0 34 14"><path d="M2 10Q9 0 17 9Q25 0 32 10"/></svg>
    <svg class="b2" viewBox="0 0 34 14"><path d="M2 10Q9 0 17 9Q25 0 32 10"/></svg>
    <svg class="b3" viewBox="0 0 34 14"><path d="M2 10Q9 0 17 9Q25 0 32 10"/></svg>
  </div>
  <svg class="hills" viewBox="0 0 800 300" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 110Q140 20 300 90T560 70T800 50V300H0Z" fill="#8a5a78"/>
    <path d="M0 190Q180 110 360 170T650 150T800 140V300H0Z" fill="#4b2f4d"/>
  </svg>
  <div class="msg" aria-live="polite">
    <h1 id="hi"></h1>
    <div id="lines"></div>
    <p class="from" id="from"></p>
  </div>
  <canvas id="fog" aria-label="Foggy window. Wipe it with your finger or mouse."></canvas>
  <div class="frame" aria-hidden="true"></div>
  <div class="hint" id="hint" aria-hidden="true">Wipe the window<i>☝</i></div>
</main>
<script>
const $=s=>document.querySelector(s);

/* ===== EDIT HERE: her name, your name, and your message lines ===== */
const CONFIG={
  name:'baby',
  from:'',
  lines:[
    'I hope you woke up with a smile today. Just a little reminder that someone is thinking about you, and yes, it’s me.',
    'Take your time, drink some water, eat your breakfast, and don’t forget to smile. I hope your day goes well and brings you lots of happiness.',
    'And if your day gets a little stressful, remember that you’re doing great. I may not be beside you right now, but I hope this little message makes your morning better.',
    'Have a beautiful day, pretty. And remember, the sun isn’t the only thing that makes mornings brighter.'
  ]
};
/* Or send a link: page-url/?name=Maria&from=Alex&msg=First line|Second line|Third line */

const qs=new URLSearchParams(location.search);
const clean=(s,n)=>(s||'').trim().slice(0,n);
const name=clean(qs.get('name'),30)||CONFIG.name;
const from=clean(qs.get('from'),30)||CONFIG.from;
const custom=(qs.get('msg')||'').split('|').map(x=>clean(x,400)).filter(Boolean).slice(0,6);
const lines=custom.length?custom:CONFIG.lines;
$('#hi').textContent='Good morning'+(name?', '+name:'')+'.';
lines.forEach(t=>{const p=document.createElement('p');p.textContent=t;$('#lines').appendChild(p)});
if(from)$('#from').textContent='With love, '+from;

const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const cv=$('#fog'),cx=cv.getContext('2d');
const sm=document.createElement('canvas');sm.width=sm.height=40;
const sx=sm.getContext('2d',{willReadFrequently:true});
let W=0,H=0,done=false,down=false,last=null,lastCheck=0;

function fog(){
  const dpr=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  cx.globalCompositeOperation='source-over';cx.shadowBlur=0;
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(228,236,243,.93)');g.addColorStop(1,'rgba(198,212,225,.93)');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  for(let i=0;i<240;i++){
    cx.beginPath();cx.arc(Math.random()*W,Math.random()*H,.6+Math.random()*2.2,0,6.283);
    cx.fillStyle='rgba(255,255,255,'+(.15+Math.random()*.3)+')';cx.fill();
  }
}
function wipe(x,y){
  cx.globalCompositeOperation='destination-out';
  cx.shadowColor='#000';cx.shadowBlur=26;
  cx.lineCap=cx.lineJoin='round';cx.lineWidth=Math.max(56,Math.min(W,H)*.1);
  cx.beginPath();
  if(last)cx.moveTo(last.x,last.y);else cx.moveTo(x,y);
  cx.lineTo(x+.01,y);cx.stroke();
  last={x,y};
  $('#hint').classList.add('gone');
}
function check(){
  sx.clearRect(0,0,40,40);sx.drawImage(cv,0,0,40,40);
  const d=sx.getImageData(0,0,40,40).data;let c=0;
  for(let i=3;i<d.length;i+=4)if(d[i]<120)c++;
  if(c/1600>.42)reveal();
}
function heart(cls,x,y){
  const h=document.createElement('span');
  h.className='heart '+cls;h.textContent='♥';
  h.style.fontSize=(14+Math.random()*22)+'px';
  if(cls==='rise'){
    h.style.left=Math.random()*100+'%';
    h.style.setProperty('--d',(5+Math.random()*5)+'s');
    h.style.setProperty('--r',(Math.random()*60-30)+'deg');
    h.style.animationDelay=(Math.random()*2.5)+'s';
  }else{h.style.left=(x-10)+'px';h.style.top=(y-14)+'px'}
  $('#win').appendChild(h);
  setTimeout(()=>h.remove(),12000);
}
function reveal(){
  if(done)return;done=true;
  document.body.classList.add('done');
  cv.style.opacity=0;cv.style.pointerEvents='none';
  setTimeout(()=>{cv.style.display='none'},1700);
  if(!reduce)for(let i=0;i<18;i++)heart('rise');
}
cv.addEventListener('pointerdown',e=>{down=true;last=null;cv.setPointerCapture(e.pointerId);wipe(e.clientX,e.clientY)});
cv.addEventListener('pointermove',e=>{
  if(!down)return;wipe(e.clientX,e.clientY);
  const t=performance.now();if(t-lastCheck>250){lastCheck=t;check()}
});
const end=()=>{down=false;last=null;if(!done)check()};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
$('#win').addEventListener('pointerdown',e=>{if(done&&!reduce)heart('pop',e.clientX,e.clientY)});
addEventListener('resize',()=>{if(!done&&innerWidth!==W)fog()});
fog();
</script>
</body>
</html>
